[workspace]
members = ["crates/core", "crates/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT"

[workspace.dependencies]
x402-types = { version = "=2.0.2", default-features = false }
x402-chain-eip155 = { version = "=2.0.2", default-features = false }
alloy-primitives = "=1.6.0"
alloy-sol-types = { version = "=1.6.0", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = "=0.4.3"
url = "2.5"
